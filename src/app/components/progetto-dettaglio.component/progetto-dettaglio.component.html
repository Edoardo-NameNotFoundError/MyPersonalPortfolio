@if(project(); as p) {
  <article class="project-detail-page">
    
    <header class="detail-header">
      <h1>{{ p.title | l }}</h1>
      
      <div class="meta-info">
        <span class="badge"> {{ p.size }}</span>
        @if(p.liveUrl) {
          <a [href]="p.liveUrl" target="_blank" class="live-link">
            {{ 'projects.labels.demoDisponibile' | t }}
          </a>
        }
      </div>

      <div class="tech-stack">
        @for (tech of p.technologies; track tech) {
          <span class="tech-tag">{{ tech }}</span>
        }
      </div>
    </header>

    <section 
      class="markdown-body" 
      [innerHTML]="p.bodyHtml | l">
    </section>

  </article>
} @else {
  <p>Progetto non trovato.</p>
}
