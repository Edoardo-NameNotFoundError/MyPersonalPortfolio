<div class="noise"></div>
<div class="overlay"></div>
<div class="terminal">
    <!-- TITOLO -->
    <h1>{{'notFoundPage.title' | t }} <span class="errorcode">404</span></h1>
    
    <!-- DESCRIZIONE -->
    <p class="output">{{ 'notFoundPage.description' | t }}</p>
    
    <!-- AZIONI CON I LINK IN MEZZO -->
    <p class="output">
      {{ 'notFoundPage.prompt' | t }}
      <a href="javascript:history.back()">{{ 'notFoundPage.goBack' | t }}</a> 
      {{ 'notFoundPage.or' | t }} 
      <a [routerLink]="['/', i18n.lang(), 'home']">{{ 'notFoundPage.goHome' | t }}</a>.
    </p>
    
    <!-- SALUTO FINALE -->
    <p class="output">{{ 'notFoundPage.goodLuck' | t }}</p>
</div>
