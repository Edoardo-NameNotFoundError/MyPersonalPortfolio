name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Parte in automatico a ogni push del main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- SEZIONE CONTROLLI QUALITÀ E SICUREZZA ---

      - name: Gitleaks (Secret Scanner)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Linting
        run: npm run lint

      - name: Run Tests
        run: npm run test:ci

      # --- SEZIONE BUILD E DEPLOY ---

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/MyPersonalPortfolioApp/browser' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4